<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Form</title>
</head>
<body>
<h1 th:text="${post != null} ? 'Update' : 'New'">Form title</h1>

<form th:action="${post.id != null} ? @{/admin/posts/update/{id}(id=${post.id})} : @{/admin/posts/save}"
      th:object="${post}"
      method="post">
  <input type="hidden" th:if="${post != null}" th:field="*{id}"/>

  <div>
    <label>Title</label>
    <input type="text" th:field="*{title}"/>
    <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Error on title</div>
  </div>

  <div>
    <label>Content</label>
    <textarea th:field="*{content}"></textarea>
    <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}">Error on content</div>
  </div>

  <div>
    <label>
      <input type="checkbox" th:field="*{isNotice}"/> Mark as Notice
    </label>
  </div>

  <button type="submit">Save</button>
  <a th:href="@{/admin/posts}">Cancel</a>
</form>
</body>
</html>
