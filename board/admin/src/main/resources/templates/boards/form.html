<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/base :: head}"></head>
<body>
<div th:replace="~{layout/base :: content(~{::section})}">
  <section>
  <h3 th:text="${board.id} != null ? 'Edit Board' : 'New Board'">Board Form</h3>

  <form class="needs-validation" novalidate
        th:object="${board}"
        th:action="${board.id} != null ? @{/admin/boards/update/{id}(id=${board.id})} : @{/admin/boards/save}"
        method="post">

    <input type="hidden" th:if="${board.id != null}" th:field="*{id}"/>

    <div class="mb-3">
      <label class="form-label">Name</label>
      <input class="form-control" type="text" th:field="*{name}" required maxlength="100">
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" rows="6" th:field="*{description}" maxlength="5000"></textarea>
    </div>

    <div class="mt-4 d-flex gap-2">
      <button class="btn btn-primary" type="submit">Save</button>
      <a href="/admin/boards" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</section>
</div>
</body>
</html>
