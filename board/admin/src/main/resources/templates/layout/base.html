<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="Admin">Admin</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
      body { background: #f6f8fb; }
      .navbar-brand { font-weight: 700; }
      .container-narrow { max-width: 1100px; }
      .table thead th { white-space: nowrap; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="/admin">Dumm2 Admin</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a href="/admin/boards" class="nav-link">Boards</a></li>
        <li class="nav-item"><a href="/admin/posts" class="nav-link">Posts</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container container-narrow py-4" th:fragment="content(content)">
  <div th:insert="${content}"></div>
</main>

<footer class="py-4 text-center text-muted">
  <small>&copy; <span th:text="${#temporals.format(T(java.time.LocalDateTime).now(), 'yyyy')}">2025</span> Dumm2</small>
</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    (function () {
        $(document).on('submit', 'form.needs-validation', function (e) {
            if (!this.checkValidity()) { e.preventDefault(); e.stopPropagation(); }
            $(this).addClass('was-validated');
        });
    })();
</script>
</body>
</html>
